<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>Záznam vad vozu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen inspection app. Header + area tabs, full-bleed 3D stage, bottom action bar, bottom sheets for forms. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e4e9ef; --fg:#16202b; --muted:#5a6676; --line:#cfd6df;
  --accent:#1d5fd0; --accent-fg:#ffffff; --stage:#dfe5ec; --scrim:rgba(14,20,28,.45);
  --sevA:#c62828; --sevB:#c77700; --sevC:#3d6fa8; --ok:#2e7d4f;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#18202a; --surface-2:#232d39; --fg:#e6ecf2; --muted:#9aa7b6; --line:#2f3b49;
  --accent:#6a9ef2; --accent-fg:#0b1220; --stage:#131a22; --scrim:rgba(0,0,0,.6);
  --sevA:#ef5a56; --sevB:#f0a02a; --sevC:#77a5dd; --ok:#5cbf86; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#18202a; --surface-2:#232d39; --fg:#e6ecf2; --muted:#9aa7b6; --line:#2f3b49;
  --accent:#6a9ef2; --accent-fg:#0b1220; --stage:#131a22; --scrim:rgba(0,0,0,.6);
  --sevA:#ef5a56; --sevB:#f0a02a; --sevC:#77a5dd; --ok:#5cbf86; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.toprow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.vehicle{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;min-width:0;max-width:60%}
.vehicle .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.vehicle .val{font-family:var(--mono);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:none;padding:10px 10px 11px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .cnt{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--surface-2);font-size:11px;font-family:var(--mono);color:var(--muted)}
.tab .short{display:none}
@media (max-width:440px){.tab .long{display:none}.tab .short{display:inline}.tab{flex:1 1 auto;padding-inline:2px;font-size:13.5px}.tab .cnt{margin-left:3px;min-width:14px;padding:0 4px}.tabs{gap:0}}

main{flex:1;position:relative;min-height:0}
.stage{position:absolute;inset:0;background:var(--stage);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.08);pointer-events:none;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.hint kbd{font-family:var(--font);font-weight:700}
.press{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid var(--accent);pointer-events:none;opacity:0;transform:scale(.3)}
.press.on{animation:press 550ms linear forwards}
@keyframes press{from{opacity:.25;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.press.on{animation:none;opacity:1;transform:none}}

.dyn{position:absolute;inset:0;overflow-y:auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:14px 24px;background:var(--bg)}
.dyn h2{font-size:15px;margin:0 0 4px}
.dyn p.sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.checks{display:flex;flex-direction:column;gap:8px;max-width:720px}
.check{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.check .name{font-weight:600;min-width:0}
.check .state{font-size:12px;color:var(--muted)}
.check .state.ok{color:var(--ok)}
.check .state.bad{color:var(--sevA)}
.check .btns{display:flex;gap:6px;grid-row:span 2}
.check ul{grid-column:1/-1;margin:2px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.check li{font-size:13px;display:flex;gap:8px;align-items:center}

.bar{background:var(--surface);border-top:1px solid var(--line);padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:10px;display:flex;gap:8px;align-items:center}
.bar .view{flex:1;min-width:0;position:relative}
.bar select{width:100%;appearance:none;-webkit-appearance:none;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 30px 10px 10px;font-size:14px}
.bar .view::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:none}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--sevA)}
.btn.danger.armed{background:var(--sevA);border-color:var(--sevA);color:#fff}
.btn .badge{font-family:var(--mono);background:var(--accent);color:var(--accent-fg);border-radius:9px;padding:0 6px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:16px 16px 0 0;max-height:90%;overflow-y:auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-top:8px;padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));box-shadow:0 -6px 24px rgba(0,0,0,.18)}
@media (min-width:760px){.sheet{left:50%;right:auto;width:640px;transform:translateX(-50%)}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:0;font-size:18px}
.loc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 14px;font-size:13px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--fg)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.field>.lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input[type=text],.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:15px;width:100%;box-sizing:border-box}
.field textarea{min-height:64px;resize:vertical}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.chip b{font-size:14px;font-weight:600}
.chip small{font-size:11.5px;color:var(--muted);line-height:1.3}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--surface)}
.sev{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sev .chip{border-left-width:5px}
.sev .chip[data-s="A"]{border-left-color:var(--sevA)}
.sev .chip[data-s="B"]{border-left-color:var(--sevB)}
.sev .chip[data-s="C"]{border-left-color:var(--sevC)}
.photo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo img{width:88px;height:66px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.actions .grow{flex:1}
.err{color:var(--sevA);font-size:13px;min-height:1em}

.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);text-align:left;width:100%}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--mono);font-weight:600;font-size:13px}
.num.A{background:var(--sevA)}.num.B{background:var(--sevB)}.num.C{background:var(--sevC)}
.item .t{font-weight:600;min-width:0}
.item .s{font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:11px;color:var(--muted);font-family:var(--mono);text-align:right}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;border:1px dashed var(--muted);color:var(--muted);border-radius:4px;padding:0 4px;margin-left:6px;font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0;font-size:14px}
.detail dt{color:var(--muted)}
.detail dd{margin:0;min-width:0;overflow-wrap:anywhere}
.detail img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.sumrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.busy{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;color:#fff;font-weight:600}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
</style>

<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand"><b>Záznam vad</b><span>Kontrola vozu · SUV</span></div>
      <button class="vehicle" id="vehBtn" type="button" aria-label="Údaje o voze a operátorovi">
        <span class="lbl">VIN</span><span class="val" id="vinVal">nevyplněno</span>
      </button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Oblast kontroly">
      <button class="tab" role="tab" data-area="ext" aria-selected="true">Exteriér<span class="cnt" data-cnt="ext">0</span></button>
      <button class="tab" role="tab" data-area="int" aria-selected="false">Interiér<span class="cnt" data-cnt="int">0</span></button>
      <button class="tab" role="tab" data-area="eng" aria-selected="false"><span class="long">Motorový prostor</span><span class="short">Motor</span><span class="cnt" data-cnt="eng">0</span></button>
      <button class="tab" role="tab" data-area="dyn" aria-selected="false">Dynamika<span class="cnt" data-cnt="dyn">0</span></button>
    </nav>
  </header>

  <main>
    <div class="stage" id="stage">
      <div class="loading" id="loading">Načítám 3D model…</div>
      <div class="hint" id="hint">Otáčejte tažením · <kbd>podržte prst</kbd> na místě vady</div>
      <div class="press" id="press"></div>
    </div>
    <section class="dyn" id="dyn" hidden>
      <h2>Dynamická jízda</h2>
      <p class="sub">Každou kontrolu označte jako OK, nebo k ní zapište vadu.</p>
      <div class="checks" id="checks"></div>
    </section>
  </main>

  <footer class="bar">
    <div class="view" id="viewWrap"><select id="viewSel" aria-label="Pohled na model"></select></div>
    <button class="btn" id="listBtn" type="button">Vady <span class="badge" id="totalCnt">0</span></button>
    <button class="btn primary" id="exportBtn" type="button">Excel</button>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden></div>
<div class="busy" id="busy" hidden>Připravuji Excel…</div>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
(function(){
"use strict";

/* ---------- Číselníky ---------- */
const TYPES = [
  {id:"scratch",  label:"Škrábanec",               hint:"rýha v laku nebo plastu"},
  {id:"dent",     label:"Promáčklina / důlek",     hint:"deformace plechu"},
  {id:"paint",    label:"Vada laku",               hint:"stékanec, kráter, nečistota v laku"},
  {id:"gap",      label:"Spára / přesah",          hint:"nestejná mezera, nesedí díly"},
  {id:"missing",  label:"Chybějící / uvolněný díl",hint:"klip, krytka, šroub"},
  {id:"damaged",  label:"Prasklý / poškozený díl", hint:"plast, sklo, čalounění"},
  {id:"dirt",     label:"Znečištění",              hint:"skvrna, otisk, lepidlo"},
  {id:"noise",    label:"Hluk / vrzání",           hint:"drnčení, pískání, klepání"},
  {id:"function", label:"Nefunkční prvek",         hint:"elektrika, ovládání, kontrolka"},
  {id:"leak",     label:"Netěsnost / únik",        hint:"olej, chladivo, voda"}
];
const TYPE = Object.fromEntries(TYPES.map(t=>[t.id,t]));
const SEV = {
  A:{label:"A – kritická", hint:"bezpečnost nebo funkce"},
  B:{label:"B – hlavní",   hint:"viditelná, nutná oprava"},
  C:{label:"C – vedlejší", hint:"drobná, kosmetická"}
};
const AREAS = {ext:"Exteriér", int:"Interiér", eng:"Motorový prostor", dyn:"Dynamika"};
const DYN_CHECKS = [
  "Start motoru a volnoběh","Akcelerace a řazení","Brzdy – účinnost a hluk","Řízení – vůle a tah do strany",
  "Podvozek – rázy a klepání","Hluk větru a vrzání interiéru","Vibrace volantu, sedadel a podlahy",
  "Asistenční systémy (ADAS)","Klimatizace a topení","Kontrolky na přístrojovém štítu"
];
const SEV_HEX = {A:"#c62828", B:"#d17d00", C:"#3d6fa8"};

/* ---------- Stav (uložen v prohlížeči) ---------- */
const KEY = "zaznam-vad-v1";
function seed(){
  return {vin:"", operator:"", seq:2, checks:{}, defects:[
    {id:"ex1", n:1, area:"ext", part:"Přední dveře (L)", type:"scratch", sev:"B", note:"Škrábanec cca 3 cm u zadní hrany dveří",
     point:[0.12,0.86,-0.935], normal:[0,0,-1], cam:{p:[0.9,1.25,-3.4], t:[0.4,0.8,-0.9]}, time:new Date().toISOString(), example:true, photo:null},
    {id:"ex2", n:2, area:"int", part:"Zadní sedadlo pravé – sedák", type:"dirt", sev:"C", note:"Skvrna na potahu",
     point:[-0.92,0.70,0.52], normal:[0,1,0], cam:{p:[0.4,2.7,1.3], t:[-0.9,0.65,0.3]}, time:new Date().toISOString(), example:true, photo:null}
  ]};
}
let state;
try{ const raw = localStorage.getItem(KEY); state = raw ? JSON.parse(raw) : seed(); }catch(e){ state = seed(); }
state.checks = state.checks || {}; state.defects = state.defects || [];
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast("Úložiště v prohlížeči je plné. Vyexportujte Excel a smažte staré vady."); }
}

/* ---------- Pomocné UI ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2800); }
function fmtTime(iso){ const d=new Date(iso); const p=n=>String(n).padStart(2,"0"); return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
let sheetClose = null;
function openSheet(html, onClose){
  const sh=$("#sheet"); sh.innerHTML='<div class="grab"></div>'+html; sh.hidden=false; $("#scrim").hidden=false; sh.scrollTop=0;
  sheetClose = onClose||null;
  return sh;
}
function closeSheet(){
  $("#sheet").hidden=true; $("#scrim").hidden=true; $("#sheet").innerHTML="";
  const f=sheetClose; sheetClose=null; if(f) f();
}
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#sheet").hidden) closeSheet(); });
function armButton(btn, label, action){ // dvoukrokové potvrzení (dialogy confirm() nejsou k dispozici)
  btn.addEventListener("click", ()=>{
    if(btn.classList.contains("armed")){ action(); return; }
    const orig=btn.textContent; btn.classList.add("armed"); btn.textContent=label;
    setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove("armed"); btn.textContent=orig; } },3000);
  });
}

/* ---------- 3D scéna ---------- */
const stage = $("#stage");
let renderer, scene, camera, controls, raycaster = null;
const groups = {}, pickables = {ext:[],int:[],eng:[]}, markerGroups = {};
const markerSprites = new Map();
let currentArea = "ext", started = false;
const HALF_W = 0.93;
const taper = y => y<=1.05 ? 1 : 1 - 0.13*Math.min(1,(y-1.05)/0.6);

function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#dfe5ec"; }

function initThree(){
  if(!window.THREE || !THREE.OrbitControls){ $("#loading").textContent="3D knihovnu se nepodařilo načíst. Zkontrolujte připojení a obnovte stránku."; return false; }
  if(THREE.ColorManagement) THREE.ColorManagement.legacyMode = false;
  MAT = makeMats();
  renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.prepend(renderer.domElement);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.12;
  controls.minDistance = 0.6; controls.maxDistance = 11; controls.maxPolarAngle = Math.PI*0.53;
  raycaster = new THREE.Raycaster();

  scene.add(new THREE.HemisphereLight(0xffffff, 0x7d8a99, 0.85));
  const d1 = new THREE.DirectionalLight(0xffffff, 0.85); d1.position.set(4,6,-3); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0xffffff, 0.35); d2.position.set(-4,3,5); scene.add(d2);
  scene.add(groundShadow());

  const bodyGeo = buildBodyGeometry();
  groups.ext = buildExterior(bodyGeo);
  groups.int = buildInterior(bodyGeo);
  groups.eng = buildEngine(bodyGeo);
  for(const a of ["ext","int","eng"]){ markerGroups[a]=new THREE.Group(); groups[a].add(markerGroups[a]); scene.add(groups[a]); }
  applyTheme();
  new ResizeObserver(resize).observe(stage); resize();
  $("#loading").remove();
  (function loop(){ requestAnimationFrame(loop); tick(); controls.update(); renderer.render(scene,camera); })();
  return true;
}
function applyTheme(){ if(renderer) renderer.setClearColor(new THREE.Color(cssVar("--stage")), 1); }
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
function resize(){
  const w=stage.clientWidth, h=stage.clientHeight; if(!w||!h) return;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}

function groundShadow(){
  const c=document.createElement("canvas"); c.width=c.height=256; const g=c.getContext("2d");

  g.fillStyle=grd; g.fillRect(0,0,256,256);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(6.4,3.2), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false}));
  m.rotation.x=-Math.PI/2; m.position.y=0.002; return m;
}

/* Tvar inspirovaný novým Tucsonem: hranatá karoserie, plochá střecha, kolmá záď, hranaté podběhy s černým lemem. */
const FRONT_AXLE=1.42, REAR_AXLE=-1.38;
function archPts(cx, grow){ const g=grow||0;
  return [[cx-0.48-g,0.40],[cx-0.44-g,0.70+g*0.6],[cx-0.30-g*0.6,0.80+g],[cx+0.30+g*0.6,0.80+g],[cx+0.44+g,0.70+g*0.6],[cx+0.48+g,0.40]]; }
function buildBodyGeometry(){
  const s=new THREE.Shape();
  s.moveTo(-2.36,0.42);
  for(const [x,y] of archPts(REAR_AXLE)) s.lineTo(x,y);
  for(const [x,y] of archPts(FRONT_AXLE)) s.lineTo(x,y);
  s.lineTo(2.30,0.40); s.lineTo(2.40,0.55); s.lineTo(2.42,0.98); s.lineTo(2.36,1.06);
  s.lineTo(1.15,1.12); s.lineTo(0.62,1.62); s.lineTo(-1.95,1.66); s.lineTo(-2.30,1.55);
  s.lineTo(-2.37,1.00); s.lineTo(-2.36,0.42);
  const bt=0.06, depth=2*HALF_W-2*bt;
  const g=new THREE.ExtrudeGeometry(s,{depth, bevelEnabled:true, bevelThickness:bt, bevelSize:0.05, bevelSegments:3, curveSegments:12});
  g.translate(0,0,-depth/2);
  const pos=g.attributes.position;
  for(let i=0;i<pos.count;i++) pos.setZ(i, pos.getZ(i)*taper(pos.getY(i)));
  g.computeVertexNormals();
  return g;
}

function mesh(geo, mat, name, parent, pos, extra){
  const m=new THREE.Mesh(geo,mat); if(pos) m.position.set(pos[0],pos[1],pos[2]);
  if(name){ m.userData.part=name; }
  if(extra) Object.assign(m.userData, extra);
  parent.add(m); return m;
}
function box(w,h,d){ return new THREE.BoxGeometry(w,h,d); }

function sidePoly(pts, side, mat, name, parent, off, holes){
  off = off ?? 0.006; holes = holes || [];
  const v2 = pts.map(p=>new THREE.Vector2(p[0],p[1]));
  const h2 = holes.map(h=>h.map(p=>new THREE.Vector2(p[0],p[1])));
  const tris = THREE.ShapeUtils.triangulateShape(v2, h2);
  const all = pts.concat(...holes);
  const arr=[]; all.forEach(p=>arr.push(p[0], p[1], side*(HALF_W*taper(p[1])+off)));
  const g=new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(arr,3));
  g.setIndex(tris.flat()); g.computeVertexNormals();
  return mesh(g, mat, name, parent);
}
function slopeGlass(a, b, outward, inset, mat, name, parent){
  const len=Math.hypot(outward[0],outward[1]); const n=[outward[0]/len, outward[1]/len]; const off=0.056;
  const pt=t=>[a[0]+(b[0]-a[0])*t + n[0]*off, a[1]+(b[1]-a[1])*t + n[1]*off];
  const p0=pt(0.07), p1=pt(0.93);
  const z0=HALF_W*taper(p0[1])-inset, z1=HALF_W*taper(p1[1])-inset;
  const arr=[p0[0],p0[1],-z0, p0[0],p0[1],z0, p1[0],p1[1],z1, p1[0],p1[1],-z1];
  const g=new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(arr,3));
  g.setIndex([0,1,2, 0,2,3]); g.computeVertexNormals();
  return mesh(g, mat, name, parent);
}

function pixelTexture(cols, rows, on, off){
  const c=document.createElement("canvas"); c.width=cols*8; c.height=rows*8; const g=c.getContext("2d");
  g.fillStyle=off; g.fillRect(0,0,c.width,c.height); g.fillStyle=on;
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++) g.fillRect(i*8+1,j*8+1,6,6);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
}
function textTexture(txt){
  const c=document.createElement("canvas"); c.width=512; c.height=64; const g=c.getContext("2d");
  g.clearRect(0,0,512,64); g.fillStyle="#d9dde1"; g.font="600 40px 'IBM Plex Sans', Arial, sans-serif"; g.textAlign="center"; g.textBaseline="middle";
  g.letterSpacing="22px"; g.fillText(txt,256,34);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
}
function line(G, pts, mat){ G.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(...p))), mat||MAT.seam)); }

function buildExterior(bodyGeo){
  const G=new THREE.Group(); const P=pickables.ext;
  const body=mesh(bodyGeo, MAT.paint, null, G, null, {kind:"body"}); P.push(body);
  const pixelMat=new THREE.MeshStandardMaterial({map:pixelTexture(6,8,"#f4f8ff","#20262d"), emissive:0x8899aa, emissiveIntensity:0.15, roughness:0.3});
  const grilleMat=new THREE.MeshStandardMaterial({map:pixelTexture(40,7,"#3a4148","#15191d"), roughness:0.6});
  const tailMat=new THREE.MeshStandardMaterial({map:pixelTexture(3,12,"#e0303a","#4a0c10"), emissive:0x5a0b0f, emissiveIntensity:0.5, roughness:0.3});
  for(const side of [-1,1]){
    const S = side<0 ? "L" : "P";
    // černý pás skel (černé sloupky = „plovoucí“ střecha)
    sidePoly([[1.10,1.15],[-2.27,1.20],[-2.27,1.56],[-1.95,1.635],[0.64,1.60]], side, MAT.gloss, null, G, 0.004);
    P.push(sidePoly([[1.00,1.18],[0.05,1.18],[0.05,1.57],[0.58,1.57]], side, MAT.glass, `Okno předních dveří (${S})`, G, 0.008));
    P.push(sidePoly([[-0.05,1.18],[-1.10,1.20],[-1.10,1.58],[-0.05,1.58]], side, MAT.glass, `Okno zadních dveří (${S})`, G, 0.008));
    P.push(sidePoly([[-1.20,1.21],[-2.14,1.23],[-2.10,1.56],[-1.20,1.58]], side, MAT.glass, `Zadní boční okno (${S})`, G, 0.008));
    // hranaté lemy podběhů
    for(const [cx,label] of [[FRONT_AXLE,"přední"],[REAR_AXLE,"zadní"]]){
      P.push(sidePoly(archPts(cx,0.10), side, MAT.plastic, `Lem podběhu ${label} (${S})`, G, 0.012, [archPts(cx,-0.05).reverse()]));
      const name=`Kolo ${label} (${S})`;
      P.push(mesh(new THREE.CylinderGeometry(0.36,0.36,0.25,36).rotateX(Math.PI/2), MAT.tire, name, G, [cx,0.36,side*0.80]));
      P.push(mesh(new THREE.CylinderGeometry(0.25,0.25,0.02,28).rotateX(Math.PI/2), MAT.rim, name, G, [cx,0.36,side*0.928]));
      P.push(mesh(new THREE.CylinderGeometry(0.07,0.07,0.02,5).rotateX(Math.PI/2), MAT.gloss, name, G, [cx,0.36,side*0.940]));
    }
    // světla a doplňky
    P.push(mesh(box(0.04,0.30,0.16), pixelMat, `Přední světlomet (${S})`, G, [2.465,0.80,side*0.74]));
    P.push(mesh(box(0.04,0.40,0.10), tailMat, `Zadní svítilna (${S})`, G, [-2.415,1.16,side*0.80]));
    P.push(mesh(box(0.20,0.12,0.14), MAT.gloss, `Vnější zpětné zrcátko (${S})`, G, [1.00,1.24,side*1.02]));
    P.push(mesh(box(0.18,0.03,0.02), MAT.gloss, `Klika předních dveří (${S})`, G, [0.30,1.07,side*0.942]));
    P.push(mesh(box(0.18,0.03,0.02), MAT.gloss, `Klika zadních dveří (${S})`, G, [-0.82,1.08,side*0.942]));
    P.push(mesh(box(2.1,0.04,0.05), MAT.plastic, `Střešní ližina (${S})`, G, [-0.70,1.74,side*0.64]));
    P.push(mesh(box(1.84,0.14,0.03), MAT.plastic, `Práh (${S})`, G, [0.02,0.47,side*0.937]));
    // spáry, prolisy
    const z=side*(HALF_W+0.004);
    for(const [x,y0] of [[0.98,0.74],[0.0,0.42],[-1.12,0.79]]) line(G,[[x,y0,z],[x,1.15,z]]);
    line(G,[[1.13,1.02,z],[2.42,1.00,z]]);                 // spára kapoty typu „clamshell“ na boku
    line(G,[[2.10,0.98,z],[-2.30,0.92,z]], MAT.crease);   // ostrý prolis přes dveře
    line(G,[[0.90,0.66,z],[-0.86,0.70,z]], MAT.crease);
  }
  // čelo
  P.push(slopeGlass([1.15,1.12],[0.62,1.62],[0.50,0.53],0.14, MAT.glass, "Čelní sklo", G));
  P.push(slopeGlass([-1.95,1.66],[-2.30,1.55],[-0.11,0.35],0.16, MAT.glass, "Zadní sklo", G));
  P.push(mesh(box(0.03,0.025,1.62), MAT.head, "Přední světelný pás", G, [2.47,1.00,0]));
  P.push(mesh(box(0.03,0.28,1.20), grilleMat, "Maska chladiče", G, [2.468,0.76,0]));
  P.push(mesh(box(0.06,0.13,1.40), MAT.plastic, "Přední nárazník – spodní mřížka", G, [2.43,0.50,0]));
  P.push(mesh(box(0.05,0.05,0.90), MAT.rim, "Přední nárazník – ochranný kryt", G, [2.42,0.42,0]));
  // záď

  const badge=new THREE.Mesh(new THREE.PlaneGeometry(0.9,0.11), new THREE.MeshBasicMaterial({map:textTexture("TUCSON"), transparent:true}));
  badge.rotation.y=-Math.PI/2; badge.position.set(-2.43,1.20,0); G.add(badge);
  P.push(mesh(box(0.08,0.22,1.74), MAT.plastic, "Zadní nárazník – spodní část", G, [-2.39,0.53,0]));
  // kontrastní střecha
  P.push(mesh(box(2.50,0.012,1.50), MAT.gloss, "Střecha", G, [-0.66,1.716,0]));
  return G;
}

function classifyBody(p,n){
  const side = p.z<0 ? " (L)" : " (P)"; const x=p.x, y=p.y;
  if(n.y>0.6 && y>1.5) return "Střecha";
  if(y>1.15){
    if(n.x>0.45) return "Rám čelního skla";
    if(n.x<-0.45) return "Páté dveře – horní část";
    if(x>0.6) return "A-sloupek"+side;
    if(x>0.05) return "Rám okna předních dveří"+side;
    if(x>-0.05) return "B-sloupek"+side;
    if(x>-1.15) return "Rám okna zadních dveří"+side;
    return "D-sloupek"+side;
  }
  if(n.x>0.5) return y<0.68 ? "Přední nárazník" : "Přední maska / čelo";
  if(n.x<-0.5) return y<0.78 ? "Zadní nárazník" : "Páté dveře (víko kufru)";
  if(n.y>0.55) return x>1.13 ? "Kapota" : (x<-2.2 ? "Páté dveře (víko kufru)" : "Linie pod okny"+side);
  if(n.y<-0.3 && y>0.45) return (x>0 ? "Podběh přední" : "Podběh zadní")+side;
  if(n.y<-0.6) return "Spodek karoserie";
  if(x>2.25) return "Přední nárazník – roh"+side;
  if(x>1.13 && y>1.0) return "Kapota – boční hrana"+side;
  if(x>0.98) return "Přední blatník"+side;
  if(y<0.54 && x>-0.9 && x<0.94) return "Práh"+side;
  if(x>0.0) return "Přední dveře"+side;
  if(x>-1.12) return "Zadní dveře"+side;
  if(x>-2.25) return "Zadní blatník"+side;
  return "Zadní nárazník – roh"+side;
}

function ghost(bodyGeo, G){
  const g=new THREE.Mesh(bodyGeo, MAT.ghost); g.renderOrder=-1; G.add(g);
  G.add(new THREE.LineSegments(new THREE.EdgesGeometry(bodyGeo, 35), MAT.ghostLine));
}

const lastCam = {};
let tween=null;
function fitView(p,t){ // na úzkém displeji odstoupit dál, aby bylo vidět celé auto
  const a=camera.aspect||1; const f=a<1?Math.min(2.2,1.1/a):1; if(f<=1) return p;
  return [0,1,2].map(i=>t[i]+(p[i]-t[i])*f);
}
function flyTo(p,t,instant){
  const from={p:camera.position.clone(), t:controls.target.clone()};
  const to={p:new THREE.Vector3(...p), t:new THREE.Vector3(...t)};
  if(instant || matchMedia("(prefers-reduced-motion: reduce)").matches){ camera.position.copy(to.p); controls.target.copy(to.t); tween=null; return; }
  tween={from,to,start:performance.now(),dur:480};
}
function tick(){
  if(!tween) return;
  let k=Math.min(1,(performance.now()-tween.start)/tween.dur); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  camera.position.lerpVectors(tween.from.p, tween.to.p, e); controls.target.lerpVectors(tween.from.t, tween.to.t, e);
  if(k>=1) tween=null;
}
function fillViews(area){

function markerTexture(n, sev, pending){
  const c=document.createElement("canvas"); c.width=c.height=128; const g=c.getContext("2d");
  g.beginPath(); g.arc(64,64,54,0,Math.PI*2); g.fillStyle=pending?"#1d5fd0":SEV_HEX[sev]||"#555"; g.fill();
  g.lineWidth=10; g.strokeStyle="#ffffff"; g.stroke();
  g.fillStyle="#fff"; g.font="700 58px 'IBM Plex Mono', monospace"; g.textAlign="center"; g.textBaseline="middle";
  g.fillText(pending?"+":String(n),64,68);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
}
function makeSprite(d, pending){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:markerTexture(d.n,d.sev,pending), depthTest:true}));
  const sz = d.area==="ext"?0.13:0.085; s.scale.set(sz,sz,1); s.userData.size=sz;
  const p=new THREE.Vector3(...d.point).addScaledVector(new THREE.Vector3(...d.normal), sz*0.45);
  s.position.copy(p); s.renderOrder=5; s.userData.defectId=d.id;
  return s;
}
function syncMarkers(){
  if(!renderer) return;
  for(const [id,s] of markerSprites){ s.parent&&s.parent.remove(s); s.material.map.dispose(); s.material.dispose(); }
  markerSprites.clear();
  for(const d of state.defects){ if(d.area==="dyn"||!d.point) continue; const s=makeSprite(d); markerGroups[d.area].add(s); markerSprites.set(d.id,s); }
}

/* ---------- Dlouhý stisk ---------- */
const LONG_MS=550, MOVE_TOL=10;
let press=null, pointers=new Set(), pendingSprite=null;
function ndc(e){ const r=renderer.domElement.getBoundingClientRect(); return new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); }
function hitAt(e){
  raycaster.setFromCamera(ndc(e), camera);
  const hits=raycaster.intersectObjects(pickables[currentArea], false);
  return hits[0]||null;
}
function startPress(e){
  pointers.add(e.pointerId);
  if(pointers.size>1){ cancelPress(); return; }
  const r=stage.getBoundingClientRect(); const ring=$("#press");
  ring.style.left=(e.clientX-r.left)+"px"; ring.style.top=(e.clientY-r.top)+"px";
  ring.classList.remove("on"); void ring.offsetWidth; ring.classList.add("on");
  press={x:e.clientX,y:e.clientY,t:performance.now(),moved:false, timer:setTimeout(()=>firePress(e),LONG_MS)};
}
function cancelPress(){ if(press){ clearTimeout(press.timer); press=null; } $("#press").classList.remove("on"); }
function firePress(e){
  $("#press").classList.remove("on"); const pr=press; press=null; if(!pr) return;
  const hit=hitAt({clientX:pr.x, clientY:pr.y});
  if(!hit){ toast("Tady není žádný díl. Podržte prst přímo na voze."); return; }
  try{ navigator.vibrate && navigator.vibrate(25); }catch(_){}
  const obj=hit.object;
  const n=hit.face ? hit.face.normal.clone().transformDirection(obj.matrixWorld) : new THREE.Vector3(0,1,0);
  if(n.dot(raycaster.ray.direction)>0) n.negate();
  const part = obj.userData.kind==="body" ? classifyBody(hit.point, n) : obj.userData.part;
  const draft={area:currentArea, part, point:hit.point.toArray().map(v=>+v.toFixed(3)), normal:n.toArray().map(v=>+v.toFixed(3)),
    cam:{p:camera.position.toArray().map(v=>+v.toFixed(3)), t:controls.target.toArray().map(v=>+v.toFixed(3))}};
  pendingSprite=makeSprite({...draft,id:"pending",n:0,sev:"B"}, true); markerGroups[currentArea].add(pendingSprite);
  openDefectForm(draft);
}
function clearPending(){ if(pendingSprite){ pendingSprite.parent&&pendingSprite.parent.remove(pendingSprite); pendingSprite=null; } }

function bindPointer(){
  const el=renderer.domElement;
  el.addEventListener("pointerdown", e=>{ if(e.button>0) return; startPress(e); });
  el.addEventListener("pointermove", e=>{ if(press && Math.hypot(e.clientX-press.x,e.clientY-press.y)>MOVE_TOL){ press.moved=true; cancelPress(); } });
  const up=e=>{
    pointers.delete(e.pointerId);
    if(press && performance.now()-press.t<300){ // krátké klepnutí: otevřít značku
      const pr=press; cancelPress();
      raycaster.setFromCamera(ndc(e), camera);
      const hit=raycaster.intersectObjects(markerGroups[currentArea].children.filter(s=>s!==pendingSprite), false)[0];
      if(hit){ const d=state.defects.find(x=>x.id===hit.object.userData.defectId); if(d) openDetail(d); }
      return;
    }
    cancelPress();
  };
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up); el.addEventListener("pointerleave", e=>{ pointers.delete(e.pointerId); cancelPress(); });
  el.addEventListener("contextmenu", e=>e.preventDefault());
}

function compressImage(file, max, q){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res({data:c.toDataURL("image/jpeg",q), w:c.width, h:c.height}); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); }; img.src=url;
  });
}

let sketchR=null;
function renderSketch(d){
  const W=640,H=448;
  if(!sketchR){ sketchR=new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true}); sketchR.setPixelRatio(1); sketchR.setSize(W,H); sketchR.outputEncoding=THREE.sRGBEncoding; sketchR.setClearColor(0xf2f4f7,1); }
  const cam=new THREE.PerspectiveCamera(40,W/H,0.05,100);
  cam.position.set(...d.cam.p); cam.lookAt(new THREE.Vector3(...d.cam.t));
  const vis={}; for(const a of ["ext","int","eng"]){ vis[a]=groups[a].visible; groups[a].visible = a===d.area; }
  const saved=[]; for(const s of markerSprites.values()){ saved.push([s,s.visible,s.scale.x]); s.visible = s.userData.defectId===d.id; if(s.visible) s.scale.setScalar(s.userData.size*1.6); }
  if(pendingSprite) pendingSprite.visible=false;
  sketchR.render(scene,cam);
  const url=sketchR.domElement.toDataURL("image/jpeg",0.85);
  for(const a in vis) groups[a].visible=vis[a];
  for(const [s,v,sc] of saved){ s.visible=v; s.scale.set(sc,sc,1); }
  if(pendingSprite) pendingSprite.visible=true;
  return url;
}

}

    hr.eachCell(c=>{ c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF1D5FD0"}}; });
    const sevFill={A:"FFF8D7D7",B:"FFFCE8C8",C:"FFDCE7F4"};
    const ds=[...state.defects].sort((a,b)=>a.n-b.n);
    ds.forEach((d,i)=>{
      const row=ws.addRow({n:d.n,t:fmtTime(d.time),vin:state.vin||"",op:state.operator||"",area:AREAS[d.area],part:d.part,
        type:TYPE[d.type]?.label||d.type,sev:SEV[d.sev].label,note:(d.example?"[Ukázka] ":"")+(d.note||"")});
      row.alignment={vertical:"top",wrapText:true};
      row.getCell("sev").fill={type:"pattern",pattern:"solid",fgColor:{argb:sevFill[d.sev]}};
      const r=i+1; let h=0;
      if(d.cam && d.point){
        const id=wb.addImage({base64:renderSketch(d),extension:"jpeg"});
        ws.addImage(id,{tl:{col:9.1,row:r+0.05},ext:{width:320,height:224},editAs:"oneCell"}); h=224;
      }
      if(d.photo){
        const k=Math.min(230/(d.photoW||4), 224/(d.photoH||3));
        const id=wb.addImage({base64:d.photo,extension:"jpeg"});
        ws.addImage(id,{tl:{col:10.1,row:r+0.05},ext:{width:Math.round((d.photoW||4)*k),height:Math.round((d.photoH||3)*k)},editAs:"oneCell"}); h=Math.max(h,224);
      }
      row.height = h ? (h+10)*0.75 : 30;
    });
    const sm=wb.addWorksheet("Souhrn");
    sm.columns=[{width:30},{width:22}];
    const add=(a,b,bold)=>{ const r=sm.addRow([a,b]); if(bold) r.font={bold:true}; };
    add("Záznam vad vozu",null,true); add("VIN / číslo vozu",state.vin||"nevyplněno"); add("Operátor",state.operator||"nevyplněno");
    add("Export",fmtTime(new Date().toISOString())); add("Celkem vad",ds.length); sm.addRow([]);
    add("Podle závažnosti",null,true); for(const s of ["A","B","C"]) add(SEV[s].label, ds.filter(d=>d.sev===s).length);
    sm.addRow([]); add("Podle oblasti",null,true); for(const a of Object.keys(AREAS)) add(AREAS[a], ds.filter(d=>d.area===a).length);
    sm.addRow([]); add("Podle typu",null,true); for(const t of TYPES) add(t.label, ds.filter(d=>d.type===t.id).length);
    sm.addRow([]); add("Dynamika – kontroly",null,true); for(const c of DYN_CHECKS){ const n=ds.filter(d=>d.area==="dyn"&&d.part===c).length; add(c, n?`${n}× vada`:state.checks[c]==="ok"?"OK":"nezkontrolováno"); }
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const day=new Date().toISOString().slice(0,10);
    const vin=(state.vin||"bez-VIN").replace(/[^A-Za-z0-9_-]/g,"");
    $("#busy").hidden=true;
    await saveFile(`vady_${vin}_${day}.xlsx`, blob);
  }catch(err){ console.error(err); toast("Export se nepovedl: "+(err&&err.message||err)); }
  finally{ $("#busy").hidden=true; }
}
$("#exportBtn").addEventListener("click", exportXlsx);

/* ---------- Start ---------- */
refreshVin(); refreshCounts(); fillViews("ext");
if(initThree()){ bindPointer(); syncMarkers(); setArea("ext"); started=true; }
window.__app={state, exportXlsx, renderSketch, setArea, classifyBody};
})();
</script>
